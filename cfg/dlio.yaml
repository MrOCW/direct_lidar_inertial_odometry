/**:
  ros__parameters:

    version: 1.1.1

    adaptive: true

    publish/odom_tf: false
    publish/sensor_tf: false
    debug/enable: false

    pointcloud/deskew: true
    pointcloud/voxelize: true
    pointcloud/qos/reliability: best_effort
    pointcloud/qos/depth: 2

    imu/qos/reliability: best_effort
    imu/qos/depth: 50

    imu/calibration: true
    imu/intrinsics/accel/bias: [ 0.0, 0.0, 0.0 ]
    imu/intrinsics/accel/sm:   [ 1.,  0.,  0.,
                                 0.,  1.,  0.,
                                 0.,  0.,  1. ]
    imu/intrinsics/gyro/bias: [ 0.0, 0.0, 0.0 ]

    odom/imu/maxGap: 0.05
    odom/imu/waitTimeout: 0.05
    odom/imu/calibration/minSamples: 400
    odom/imu/calibration/gyroStddevMax: 0.01
    odom/imu/calibration/gyroMeanMax: 0.05
    odom/imu/calibration/accelNormStddevMax: 0.08
    odom/imu/calibration/accelGravityTolerance: 0.5
    odom/imu/onlineGyroBias/enabled: true
    odom/imu/onlineGyroBias/stationaryTime: 2.0
    odom/imu/onlineGyroBias/lidarLinearMax: 0.02
    odom/imu/onlineGyroBias/lidarAngularMax: 0.5
    odom/imu/onlineGyroBias/timeConstant: 30.0
    odom/imu/onlineGyroBias/maxDelta: 0.05

    odom/gicp/maxCorrectionDistance: 1.0
    odom/gicp/maxCorrectionRotation: 45.0
