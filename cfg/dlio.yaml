    odom/gicp/maxHessianConditionFactor: 10.0
    odom/gicp/softCorrectionDistance: 0.06
    odom/gicp/softCorrectionRotation: 1.0
    odom/gicp/correctionConfirmationScans: 2
    odom/gicp/correctionConsistencyDistance: 0.02
    odom/gicp/correctionConsistencyRotation: 0.5

    odom/covariance/pose/diagonal: [ 0.01, 0.01, 1000.0, 1000.0, 1000.0, 0.007615435 ]
    odom/covariance/twist/diagonal: [ 0.04, 0.04, 1000.0, 1000.0, 1000.0, 0.030461742 ]
    odom/covariance/degradedAfter: 0.2
    odom/covariance/posePositionRate: 0.5
    odom/covariance/poseYawRate: 0.25
