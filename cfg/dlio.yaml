    odom/covariance/twistYawRate: 0.25
    odom/covariance/recoveryScale: 10.0
    odom/covariance/recoveryScans: 3
    odom/publish/maxScanAge: 0.2
    odom/recovery/enabled: true
    odom/recovery/rejectedScans: 20
    odom/recovery/confirmationScans: 3

    extrinsics/baselink2imu/t: [ -0.038, 0.02329, 0.11939 ]
    extrinsics/baselink2imu/R: [ 1.,  0.,  0.,
                                 0.,  1.,  0.,
                                 0.,  0.,  1. ]
    extrinsics/baselink2lidar/t: [ -0.049,  0.,  0.16351 ]
    extrinsics/baselink2lidar/R: [ 1.,  0.,  0.,
                                   0.,  1.,  0.,
                                   0.,  0.,  1. ]
